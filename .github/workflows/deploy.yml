name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build
        run: npm run build
        
      - name: Fix for GitHub Pages
        run: |
          # Copy index.html to 404.html for client-side routing
          cp index.html 404.html
          # Add base path to index.html
          sed -i 's/src\/main.jsx/\/mistral-vibe\/src\/main.jsx/g' index.html
          sed -i 's/src\/main.jsx/\/mistral-vibe\/src\/main.jsx/g' 404.html
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
