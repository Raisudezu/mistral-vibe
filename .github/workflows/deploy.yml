name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'buhai-website/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        working-directory: ./buhai-website
        run: npm install
        
      - name: Build
        working-directory: ./buhai-website
        run: npm run build
        
      - name: Move files to root for GitHub Pages
        run: |
          mkdir -p ../deploy
          cp -r ./buhai-website/dist/* ../deploy/
          cp ./buhai-website/dist/.gitignore ../deploy/ 2>/dev/null || true
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ../deploy
          destination_dir: .
          keep_files: false
